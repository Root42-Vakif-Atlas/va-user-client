name: vakif_atlas
description: "Vakıf Atlas — VGM onaylı vakıf eserlerini WCAG 2.2 AA uyumlu sunan mobil uygulama."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  flutter_bloc: ^9.1.1

  # Routing & DI
  get_it: ^9.3.0
  go_router: ^18.1.0
  injectable: ^3.0.0

  # Networking
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  dio: ^5.11.1
  package_info_plus: ^10.2.2
  uuid: ^4.6.0

  # Storage
  flutter_secure_storage: ^11.2.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  shared_preferences: ^2.5.6

  # Accessibility (TTS + Dijital Rehber sesli giriş)
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0

  # Permissions (kamera, mikrofon, konuşma tanıma; konum geolocator'da)
  permission_handler: ^13.0.2

  # Documents (rota PDF dışa aktarımı)
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1

  # Media (Anı Köşesi fotoğrafları: seçim + küçültme + EXIF/GPS temizliği)
  image: ^4.12.0
  image_picker: ^1.2.4

  # Code generation annotations & utilities
  freezed_annotation: ^3.1.0
  intl: any
  json_annotation: ^4.12.0
  logger: ^2.8.0
  jailbreak_root_detection: ^1.2.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.1
  camera_web: ^0.3.5+6
  camera_platform_interface: ^2.15.0
  flutter_local_notifications: ^23.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # App icon
  flutter_launcher_icons: ^0.14.0

  # Code generation
  build_runner: ^2.16.1
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1

  # Testing
  alchemist: ^0.14.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/cinzel/OFL.txt
    - assets/fonts/inter/OFL.txt
    - assets/fonts/atkinson/OFL.txt
    # PDF dışa aktarımı: `pdf` paketi değişken yazı tipinde ağırlık seçemez;
    # Inter-Variable'dan üretilmiş statik örnekler (wght 400 / 600, opsz 14).
    - assets/fonts/inter/static/

  # Değişken (variable) fontlar: ağırlık `FontVariation('wght', …)` ile seçilir.
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/cinzel/Cinzel-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    # Erişilebilirlik → Disleksi Dostu (Braille Institute, OFL).
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/atkinson/AtkinsonHyperlegibleNext-Variable.ttf
